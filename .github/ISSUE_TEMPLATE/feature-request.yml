name: Feature Request
description: Suggest a new feature or improvement (建议新功能或改进)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve claude-context-templates? We'd love to hear it!
        有改进建议？欢迎提出！

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of feature is this?
      options:
        - New preset (e.g., Go, Java, Vue)
        - Improvement to existing preset
        - init.sh enhancement
        - New design principle or pattern
        - Documentation improvement
        - CI/CD improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature or improvement you'd like
      placeholder: |
        **What**: ...
        **Why**: ...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would you use this feature? What problem does it solve?
      placeholder: |
        As a [type of user], I want [feature] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any mockups, examples, or references that help explain your idea
    validations:
      required: false
