name: react-typescript
display_name: "React + TypeScript"
description: "React 前端项目模板 (TypeScript, Vite, React Query, Zustand)"
version: "1.0.0"
defaults:
  package_manager: pnpm
  linter: eslint
  test_runner: vitest
  source_root: src
  architecture_pattern: "Feature-Sliced Design (FSD)"
  coverage_minimum: 80
files:
  required:
    - CLAUDE.md
    - project-config.md
    - rules/architecture.md
    - rules/tech-stack.md
    - rules/code-style.md
    - rules/testing.md
    - rules/security.md
    - rules/checklist.md
    - rules/project-structure.md
  optional:
    - path: rules/component-design.md
      description: "组件设计规范 (组合、Props、受控/非受控模式)"
      recommended_when: "always"
      default_include: true
    - path: rules/state-management.md
      description: "状态管理规范 (Zustand、React Query、Context)"
      recommended_when: "always"
      default_include: true
    - path: rules/performance.md
      description: "性能优化 (Memoization、Code Splitting、Bundle 分析)"
      recommended_when: "production_grade or user_facing"
      default_include: false
    - path: rules/accessibility.md
      description: "无障碍规范 (WCAG、ARIA、键盘导航)"
      recommended_when: "public_facing or compliance_required"
      default_include: false
variables:
  - name: PROJECT_NAME
    prompt: "项目名称"
    required: true
  - name: SUBPROJECT_NAME
    prompt: "子项目名称"
    default: "frontend"
  - name: PACKAGE_MANAGER
    prompt: "包管理器"
    default: "pnpm"
  - name: COVERAGE_MIN
    prompt: "最低测试覆盖率 (%)"
    default: "80"
