name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-presets:
    name: Validate Presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate preset structure
        run: scripts/validate-presets.sh

  test-init:
    name: Test init.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Make init.sh executable
        run: chmod +x init.sh

      - name: Run init.sh smoke tests
        run: scripts/test-init.sh

  check-plugin-sync:
    name: Check Plugin Preset Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Check plugin presets are in sync
        run: scripts/check-plugin-sync.sh

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Check relative links in Markdown files
        run: scripts/check-links.sh
