name: react-typescript
display_name: "React + TypeScript"
description: "React 前端项目模板 (TypeScript, Vite, React Query, Zustand)"
version: "1.0.0"
defaults:
  package_manager: pnpm
  linter: eslint
  test_runner: vitest
  source_root: src
  architecture_pattern: "Feature-Sliced Design (FSD)"
  coverage_minimum: 80
files:
  required:
    - CLAUDE.md
    - project-config.md
    - rules/architecture.md
    - rules/tech-stack.md
    - rules/code-style.md
    - rules/testing.md
    - rules/security.md
    - rules/checklist.md
    - rules/project-structure.md
  optional:
    - rules/component-design.md
    - rules/state-management.md
    - rules/performance.md
    - rules/accessibility.md
variables:
  - name: PROJECT_NAME
    prompt: "项目名称"
    required: true
  - name: SUBPROJECT_NAME
    prompt: "子项目名称"
    default: "frontend"
  - name: PACKAGE_MANAGER
    prompt: "包管理器"
    default: "pnpm"
  - name: COVERAGE_MIN
    prompt: "最低测试覆盖率 (%)"
    default: "80"
