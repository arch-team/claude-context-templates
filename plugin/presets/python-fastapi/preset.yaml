name: python-fastapi
display_name: "Python + FastAPI"
description: "Python 后端 API 项目模板 (FastAPI, SQLAlchemy, Pydantic)"
version: "1.0.0"
defaults:
  package_manager: uv
  linter: ruff
  test_runner: pytest
  source_root: src
  architecture_pattern: "DDD + Modular Monolith + Clean Architecture"
  coverage_minimum: 85
files:
  required:
    - CLAUDE.md
    - project-config.md
    - rules/architecture.md
    - rules/tech-stack.md
    - rules/code-style.md
    - rules/testing.md
    - rules/security.md
    - rules/checklist.md
    - rules/project-structure.md
  optional:
    - path: rules/api-design.md
      description: "API 设计规范 (RESTful 路由、HTTP 状态码、错误响应格式)"
      recommended_when: "framework in ['FastAPI', 'Flask', 'Django']"
      default_include: true
    - path: rules/logging.md
      description: "日志规范 (structlog、Correlation ID、脱敏)"
      recommended_when: "always"
      default_include: true
    - path: rules/observability.md
      description: "可观测性 (Metrics、Tracing、Health Check)"
      recommended_when: "production_grade or deployment_detected"
      default_include: false
    - path: rules/sdk-first.md
      description: "SDK-First 原则 (优先使用 SDK 简化实现)"
      recommended_when: "always"
      default_include: true
variables:
  - name: PROJECT_NAME
    prompt: "项目名称"
    required: true
  - name: SUBPROJECT_NAME
    prompt: "子项目名称"
    default: "backend"
  - name: PACKAGE_MANAGER
    prompt: "包管理器"
    default: "uv"
  - name: COVERAGE_MIN
    prompt: "最低测试覆盖率 (%)"
    default: "85"
